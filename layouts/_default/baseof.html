<!DOCTYPE html>
<html lang="{{ $.Site.LanguageCode }}">
    {{- partial "head.html" . -}}
    <body a="{{ $.Site.Params.theme_config.appearance | default "auto" }}">
        <main class="page-content" aria-label="Content">
            <div class="page-body">
                <div class="band-main meta-band">
                    {{ if not .IsHome }}
                        <div class="default-lane">{{ partial "nav.html" . }}</div>
                    {{ else }}
                        <div class="default-lane home-title">
                            {{ .Content }}
                        </div>
                    {{ end }}
                    {{ if and hugo.IsServer $.Site.BuildDrafts }}
                        {{ partial "site-preferences.html" . }}
                    {{ end }}
                </div>
                {{- block "main" . }}{{- end }}
                <div class="footer-spacer"></div>
                <div class="band-main">
                    {{ partial "footer.html" . }}
                </div>
            </div>
        </main>
    </body>
    <script src='{{ "js/toc.js" | relURL }}'></script>
</html>
