{{ define "main" }}
{{ partial "nav.html" . }}
<h1>{{ .Title }}</h1>
{{ partial "date.html" . }}
<article>
    {{ if .Params.toc }}
        <aside {{ if .Params.tocBorder }} class="toc" {{ end }}>
            {{ .TableOfContents }}
        </aside>
    {{ end }}

    {{ .Content }}
</article>
{{ end }}
