{{ $content := .content }}
{{ $primaryMarker := `<div class="section-primary"` }}
{{ $sideMarker := `<div class="section-side"` }}
{{ $primaries := len (findRE $primaryMarker $content) }}
{{ $sides := len (findRE $sideMarker $content) }}
{{ $modifier := "" }}
{{ if and (eq $primaries 1) (eq $sides 1) }}{{ $modifier = " asymmetric" }}{{ end }}
<div class="band-wide section{{ $modifier }}">
    {{ $content }}
</div>
